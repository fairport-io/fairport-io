{{- $fairportUi := index .Values "fairport-ui" -}}
{{- if $fairportUi.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fairport-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- toYaml $fairportUi.labels | nindent 4 }}
spec:
  serviceName: fairport-ui-headless
  replicas: {{ $fairportUi.replicaCount }}
  selector:
    matchLabels:
      {{- toYaml $fairportUi.labels | nindent 6 }}
  template:
    metadata:
      labels:
        {{- toYaml $fairportUi.labels | nindent 8 }}
    spec:
      serviceAccountName: {{ $fairportUi.serviceAccount.name }}
      initContainers:
      - name: init-pglite-data
        image: {{ $fairportUi.image }}
        imagePullPolicy: {{ $fairportUi.imagePullPolicy }}
        securityContext:
          runAsUser: 0
        command: ["/bin/sh", "-c", "mkdir -p /app/pglite-data && chown -R node:node /app/pglite-data"]
        volumeMounts: {{ $fairportUi.volumeMounts | toJson }}
      containers:
      - name: fairport-ui
        image: {{ $fairportUi.image }}
        imagePullPolicy: {{ $fairportUi.imagePullPolicy }}
        ports:
        - name: http
          containerPort: 8000
        env:
        {{- $allEnv := concat $fairportUi.env $fairportUi.extraEnv }}
        {{- range $allEnv }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        resources: {{ $fairportUi.resources | toJson }}
        volumeMounts: {{ $fairportUi.volumeMounts | toJson }}
      volumes: {{ $fairportUi.volumes | toJson }}
      nodeSelector: {{ $fairportUi.nodeSelector | toJson }}
      tolerations: {{ $fairportUi.tolerations | toJson }}
      affinity: {{ $fairportUi.affinity | toJson }}
  volumeClaimTemplates: {{ $fairportUi.volumeClaimTemplates | toJson }}
{{- end }}

kube-prometheus-stack:
  enabled: true
  alertmanager:
    service:
      port: 80
    alertmanagerSpec:
      replicas: 2
      podAntiAffinity: "hard"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: [alertmanager]
            - weight: 50
              preference:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: [monitoring]
            - weight: 25
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      storage:
       volumeClaimTemplate:
         spec:
           storageClassName: openebs-hostpath
           resources:
             requests:
               storage: 2Gi
  prometheus:
    service:
      port: 80
    prometheusSpec:
      replicas: 2
      podAntiAffinity: "hard"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: [prometheus]
            - weight: 50
              preference:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: [monitoring]
            - weight: 25
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      retentionSize: 10GB
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      scrapeConfigSelectorNilUsesHelmValues: false
      storageSpec:
       volumeClaimTemplate:
         spec:
           storageClassName: openebs-hostpath
           resources:
             requests:
               storage: 5Gi
  grafana:
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values: [grafana]
          - weight: 50
            preference:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values: [monitoring]
          - weight: 25
            preference:
              matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
    imageRenderer:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: [grafana-image-renderer]
            - weight: 50
              preference:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: [monitoring]
            - weight: 25
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
    additionalDataSources:
      - name: VictoriaTraces
        uid: victoriatraces
        type: jaeger
        access: proxy
        url: 'http://{{ .Release.Name }}-vt-cluster-vtselect.{{ .Release.Namespace }}.svc.cluster.local:10471/select/jaeger'
    grafana.ini:
      # Disable Password Login for Simplicity
      auth:
        disable_login_form: true
      auth.anonymous:
        enabled: true
        org_role: Admin
      server:
        root_url: "%(protocol)s://%(domain)s/grafana/"
        serve_from_sub_path: true
    service:
      port: 80
    ingress:
      enabled: false
      path: /grafana
      pathType: Prefix
    sidecar:
      datasources:
        enabled: true
        searchNamespace: ALL

  prometheusOperator:
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values: [prometheus-operator]
          - weight: 50
            preference:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values: [monitoring]
          - weight: 25
            preference:
              matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
    admissionWebhooks:
      deployment:
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values: [prometheus-operator]
              - weight: 50
                preference:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values: [monitoring]
              - weight: 25
                preference:
                  matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: Exists
      patch:
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values: [prometheus-operator]
              - weight: 50
                preference:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values: [monitoring]
              - weight: 25
                preference:
                  matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: Exists

  kube-state-metrics:
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values: [kube-state-metrics]
          - weight: 50
            preference:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values: [monitoring]
          - weight: 25
            preference:
              matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists

  thanosRuler:
    thanosRulerSpec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: [thanos-ruler]
            - weight: 50
              preference:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: [monitoring]
            - weight: 25
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists

  crds:
    upgradeJob:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: [prometheus-operator]
            - weight: 50
              preference:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: [monitoring]
            - weight: 25
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists

  prometheus-node-exporter:
    service:
      port: 9109
      targetPort: 9109

victoria-logs-cluster:
  enabled: false

  vlstorage:
    replicaCount: 2
    retentionPeriod: 2h
    persistentVolume:
      enabled: true
      storageClassName: openebs-hostpath
      size: 10Gi
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values: [vlstorage]
          - weight: 50
            preference:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values: [monitoring]
          - weight: 25
            preference:
              matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: vlstorage
            topologyKey: kubernetes.io/hostname

  vlinsert:
    replicaCount: 2
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values: [vlinsert]
          - weight: 50
            preference:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values: [monitoring]
          - weight: 25
            preference:
              matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: vlinsert
            topologyKey: kubernetes.io/hostname

  vlselect:
    fullnameOverride: "vlselect"
    replicaCount: 2
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values: [vlselect]
          - weight: 50
            preference:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values: [monitoring]
          - weight: 25
            preference:
              matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: vlselect
            topologyKey: kubernetes.io/hostname

  vmauth:
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values: [vmauth]
          - weight: 50
            preference:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values: [monitoring]
          - weight: 25
            preference:
              matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists

  vector:
    enabled: true
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values: [vector]
          - weight: 50
            preference:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values: [monitoring]
          - weight: 25
            preference:
              matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
    haproxy:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: [vector-haproxy]
            - weight: 50
              preference:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: [monitoring]
            - weight: 25
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
    # -- Example: How to ship syslog (RFC 3164 / RFC 5424) to VictoriaLogs using Vector
    # To ingest syslog from external systems, configure a syslog source in Vector's customConfig
    # and route it to the VictoriaLogs vlinsert Elasticsearch bulk endpoint.
    # Make sure to also expose TCP/UDP port 5140 in Vector service configurations if needed.
    #
    # customConfig:
    #   sources:
    #     syslog_source:
    #       type: "syslog"
    #       address: "0.0.0.0:5140"
    #       mode: "tcp" # or "udp"
    #   sinks:
    #     victoria_logs:
    #       type: "elasticsearch"
    #       inputs:
    #         - "syslog_source"
    #       # VictoriaLogs provides an Elasticsearch-compatible bulk API at /insert/elasticsearch/
    #       endpoint: "http://vlinsert-victoria-logs-cluster:9428/insert/elasticsearch/"
    #       # Stream fields are used by VictoriaLogs for indexing and fast filtering
    #       query:
    #         _stream_fields: "appname,facility,hostname,severity"
    #         _msg_field: "message"
    #         _time_field: "timestamp"


